<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smonta il mestiere</title><style>:root{--bg:#fbf7ef;--ink:#1f2a37;--acc:#d9480f;--soft:#fff;--line:#e6ddcc;--mute:#5b6672;--verde:#2f9e44;--giallo:#f08c00;--rosso:#e03131;--blu:#1971c2}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:22px}
main{max-width:1000px;margin:0 auto;padding:30px 24px 44px}h1{font-size:34px;margin:0 0 6px}.sub{color:var(--mute);margin:0 0 24px;font-size:18px}
.card{background:var(--soft);border:2px solid var(--line);border-radius:16px;padding:18px 20px}
button{font-size:21px;padding:13px 22px;border-radius:13px;border:0;cursor:pointer;font-weight:700;background:#e9e1d2;color:var(--ink)}
button.p{background:var(--acc);color:#fff}input,textarea,select{font-size:21px;padding:10px 12px;border:2px solid var(--line);border-radius:11px;background:#fff;font-family:inherit}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.mute{color:var(--mute);font-size:18px}.big{font-size:38px;line-height:1.3}.pill{display:inline-block;padding:4px 12px;border-radius:999px;font-size:16px;font-weight:700;color:#fff}
.bar{height:14px;background:#f1e9da;border-radius:7px;overflow:hidden}.bar>div{height:100%;background:var(--acc)}

.job h2{margin:0 0 8px;font-size:26px}.task{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:19px}.tag{padding:4px 10px;border-radius:999px;color:#fff;font-size:15px;font-weight:700}.A{background:var(--blu)}.P{background:var(--acc)}
.stack{display:flex;height:20px;border-radius:10px;overflow:hidden;margin:12px 0 6px}.stack .A{background:var(--blu)}.stack .P{background:var(--acc)}
</style></head><body><main>
<h1>Smonta il mestiere</h1><p class="sub">Un mestiere è fatto di compiti. ■ blu: un'IA può aiutare · ■ arancio: serve una persona.</p>
<div class="grid2" id="g"></div>
<div class="row" style="margin-top:14px"><input id="nm" placeholder="Nuovo mestiere…" style="flex:1"><button class="p" onclick="nuovo()">Aggiungi</button><button onclick="window.print()">Stampa</button></div>
<script>
const J={"Infermiere":[["Misurare la pressione","P"],["Scrivere il diario clinico","A"],["Rassicurare un paziente spaventato","P"],["Cercare le interazioni tra farmaci","A"],["Preparare la terapia","P"],["Compilare i turni","A"],["Accorgersi che qualcosa non va","P"],["Spiegare le cure alla famiglia","P"]],"Guida turistica":[["Raccontare la storia del castello","P"],["Tradurre al volo per un gruppo","A"],["Preparare un itinerario","A"],["Rispondere a una domanda imprevista","P"],["Gestire un bambino che si perde","P"],["Scrivere il testo del depliant","A"]]};
const g=document.getElementById('g');function render(){g.innerHTML='';for(const k in J){const t=J[k],a=t.filter(x=>x[1]=='A').length,p=t.length-a;g.innerHTML+=`<div class="card job"><h2>${k}</h2>${t.map(x=>`<div class="task"><span>${x[0]}</span><span class="tag ${x[1]}">${x[1]=='A'?'può aiutare un\'IA':'serve una persona'}</span></div>`).join('')}<div class="stack"><div class="A" style="width:${100*a/t.length}%"></div><div class="P" style="width:${100*p/t.length}%"></div></div><div class="mute">In questo mestiere ${a} compiti su ${t.length} potrebbero cambiare.</div><div class="row" style="margin-top:8px"><input placeholder="Nuovo compito…" data-j="${k}" style="flex:1;font-size:17px"><button data-j="${k}" data-t="A" style="font-size:15px;padding:8px 10px">IA</button><button data-j="${k}" data-t="P" style="font-size:15px;padding:8px 10px">persona</button></div></div>`}g.querySelectorAll('button[data-j]').forEach(b=>b.onclick=()=>{const inp=g.querySelector(`input[data-j="${b.dataset.j}"]`);if(inp.value.trim()){J[b.dataset.j].push([inp.value.trim(),b.dataset.t]);render()}})}function nuovo(){const n=document.getElementById('nm').value.trim();if(n){J[n]=[];render()}}render();
</script></main></body></html>
