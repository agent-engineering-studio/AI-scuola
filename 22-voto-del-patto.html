<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Il voto del patto</title><style>:root{--bg:#fbf7ef;--ink:#1f2a37;--acc:#d9480f;--soft:#fff;--line:#e6ddcc;--mute:#5b6672;--verde:#2f9e44;--giallo:#f08c00;--rosso:#e03131;--blu:#1971c2}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:22px}
main{max-width:1000px;margin:0 auto;padding:30px 24px 44px}h1{font-size:34px;margin:0 0 6px}.sub{color:var(--mute);margin:0 0 24px;font-size:18px}
.card{background:var(--soft);border:2px solid var(--line);border-radius:16px;padding:18px 20px}
button{font-size:21px;padding:13px 22px;border-radius:13px;border:0;cursor:pointer;font-weight:700;background:#e9e1d2;color:var(--ink)}
button.p{background:var(--acc);color:#fff}input,textarea,select{font-size:21px;padding:10px 12px;border:2px solid var(--line);border-radius:11px;background:#fff;font-family:inherit}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.mute{color:var(--mute);font-size:18px}.big{font-size:38px;line-height:1.3}.pill{display:inline-block;padding:4px 12px;border-radius:999px;font-size:16px;font-weight:700;color:#fff}
.bar{height:14px;background:#f1e9da;border-radius:7px;overflow:hidden}.bar>div{height:100%;background:var(--acc)}

.reg{display:grid;grid-template-columns:1fr 70px 70px 70px 120px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:19px}.reg input{width:100%;text-align:center}.h{font-size:15px;color:var(--mute);font-weight:700}
.ok{color:var(--verde);font-weight:800}.ko{color:var(--rosso);font-weight:800}h2{font-size:22px;margin:16px 0 6px}#patto{display:none;background:#fff;padding:36px;line-height:1.6}#patto li{margin-bottom:8px}
</style></head><body><main>
<h1>Il voto del patto</h1><p class="sub">Classe 5A · 24 presenti. Regola per regola, per alzata di mano.</p>
<div id="app"><div class="card"><div class="reg h"><span>Regola</span><span>Sì</span><span>No</span><span>Ast.</span><span>Esito</span></div><h2>Noi studenti</h2><div id="s"></div><h2>Noi docenti</h2><div id="d"></div></div>
<div class="row" style="margin-top:14px"><input id="nt" placeholder="Nuova regola…" style="flex:1"><select id="ng"><option value="s">Noi studenti</option><option value="d">Noi docenti</option></select><button id="add">Aggiungi</button><button class="p" id="gen">Il nostro patto</button></div></div>
<div id="patto"></div>
<script>
let regole=[["s","Dichiariamo sempre se e come abbiamo usato l'IA in un compito.",22,1,1],["s","Il tutor socratico si usa dopo aver provato da soli.",18,4,2],["s","Nomi, foto e dati di compagni non entrano mai in una chat con un'IA.",24,0,0],["s","Una notizia che fa arrabbiare si controlla prima di condividerla.",20,2,2],["s","Niente IA per i compiti di matematica, mai.",7,15,2],["d","Diciamo prima quando un compito va fatto senza IA.",24,0,0],["d","Non usiamo rilevatori automatici per accusare uno studente.",23,0,1]];
function render(){['s','d'].forEach(g=>{document.getElementById(g).innerHTML=regole.map((r,i)=>r[0]==g?`<div class="reg"><span>${r[1]}</span><input type="number" data-i="${i}" data-k="2" value="${r[2]}"><input type="number" data-i="${i}" data-k="3" value="${r[3]}"><input type="number" data-i="${i}" data-k="4" value="${r[4]}"><span class="${r[2]>r[3]?'ok':'ko'}">${r[2]>r[3]?'Approvata':'Respinta'}</span></div>`:'').join('')});document.querySelectorAll('.reg input').forEach(x=>x.oninput=()=>{regole[x.dataset.i][x.dataset.k]=+x.value;render()})}
document.getElementById('add').onclick=()=>{const t=document.getElementById('nt').value.trim();if(!t)return;regole.push([document.getElementById('ng').value,t,0,0,0]);document.getElementById('nt').value='';render()};
document.getElementById('gen').onclick=()=>{const oggi=new Date(),rev=new Date(oggi);rev.setFullYear(oggi.getFullYear()+1);const f=d=>d.toLocaleDateString('it-IT',{day:'numeric',month:'long',year:'numeric'});const ap=g=>regole.filter(r=>r[0]==g&&r[2]>r[3]).map(r=>`<li>${r[1]}</li>`).join('');document.getElementById('app').style.display='none';const p=document.getElementById('patto');p.style.display='block';p.innerHTML=`<h1>Il patto della classe 5A sull'uso dell'IA</h1><h2>Noi studenti ci impegniamo a</h2><ol>${ap('s')}</ol><h2>Noi docenti ci impegniamo a</h2><ol>${ap('d')}</ol><p>Approvato il ${f(oggi)}. Da rileggere insieme il ${f(rev)}.</p><p>Firme: ______________________________________________________</p><button onclick="location.reload()">Torna al voto</button>`};render();
</script></main></body></html>
