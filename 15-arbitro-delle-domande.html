<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arbitro delle domande</title><style>:root{--bg:#fbf7ef;--ink:#1f2a37;--acc:#d9480f;--soft:#fff;--line:#e6ddcc;--mute:#5b6672;--verde:#2f9e44;--giallo:#f08c00;--rosso:#e03131;--blu:#1971c2}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:22px}
main{max-width:1000px;margin:0 auto;padding:30px 24px 44px}h1{font-size:34px;margin:0 0 6px}.sub{color:var(--mute);margin:0 0 24px;font-size:18px}
.card{background:var(--soft);border:2px solid var(--line);border-radius:16px;padding:18px 20px}
button{font-size:21px;padding:13px 22px;border-radius:13px;border:0;cursor:pointer;font-weight:700;background:#e9e1d2;color:var(--ink)}
button.p{background:var(--acc);color:#fff}input,textarea,select{font-size:21px;padding:10px 12px;border:2px solid var(--line);border-radius:11px;background:#fff;font-family:inherit}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.mute{color:var(--mute);font-size:18px}.big{font-size:38px;line-height:1.3}.pill{display:inline-block;padding:4px 12px;border-radius:999px;font-size:16px;font-weight:700;color:#fff}
.bar{height:14px;background:#f1e9da;border-radius:7px;overflow:hidden}.bar>div{height:100%;background:var(--acc)}

.l{list-style:none;padding:0;margin:0}.l li{padding:10px 14px;border-radius:12px;margin-bottom:8px;font-size:21px;display:flex;gap:12px;align-items:center}.ok{background:#d3f9d8}.no{background:#ffe3e3}.l li b{font-size:24px}
.cnt{display:flex;gap:20px}.cnt .card{flex:1;text-align:center}.cnt .n{font-size:48px;font-weight:800}
</style></head><body><main>
<h1>Arbitro delle domande</h1><p class="sub">Chi fa il tutor può rispondere solo con domande. L'arbitro fischia tutto il resto.</p>
<div class="cnt" style="margin-bottom:14px"><div class="card"><div class="mute">Domande accettate</div><div class="n" style="color:var(--verde)" id="a">4</div></div><div class="card"><div class="mute">Falli</div><div class="n" style="color:var(--rosso)" id="f">2</div></div></div>
<div class="row" style="margin-bottom:14px"><input id="in" style="flex:1" placeholder="La battuta del tutor…"><button class="p" id="go">Invio</button><button id="np">Nuova partita</button></div>
<ul class="l" id="l"></ul>
<script>
const vietate=["giusto","sbagliato","la risposta è","devi"];let a=0,f=0;const L=document.getElementById('l');
function giudica(t){const s=t.toLowerCase();const ok=t.trim().endsWith('?')&&!vietate.some(v=>s.includes(v));const li=document.createElement('li');li.className=ok?'ok':'no';li.innerHTML=`<b>${ok?'✔':'✘'}</b><span>${t}</span>`;L.prepend(li);ok?a++:f++;document.getElementById('a').textContent=a;document.getElementById('f').textContent=f}
document.getElementById('go').onclick=()=>{const t=document.getElementById('in').value;if(t.trim()){giudica(t);document.getElementById('in').value=''}};
document.getElementById('np').onclick=()=>{a=f=0;L.innerHTML='';document.getElementById('a').textContent=0;document.getElementById('f').textContent=0};
["Cosa succede se togli 7 da tutti e due i lati?","La risposta è 5.","Quanto fa 22 meno 7?","Devi dividere per 3.","Cosa resta da fare per avere la x da sola?","Rileggi la tua ultima riga: noti qualcosa?"].forEach(giudica);
</script></main></body></html>
